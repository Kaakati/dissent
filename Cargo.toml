[workspace]
resolver = "2"
members = [
    "crates/dissent-identity",
    "crates/dissent-events",
    "crates/dissent-net",
    "crates/dissent-discovery",
    "crates/dissent-core",
    "crates/dissent-mls",
    "crates/dissent-media",
    "crates/dissent-files",
    "crates/dissent-audio",
    "apps/seeder",
    "apps/relay",
    "apps/probe",
    "apps/push-relay",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dissent-chat/dissent"

[workspace.dependencies]
dissent-identity = { path = "crates/dissent-identity" }
dissent-files = { path = "crates/dissent-files" }
dissent-events = { path = "crates/dissent-events" }
dissent-net = { path = "crates/dissent-net" }
dissent-discovery = { path = "crates/dissent-discovery" }
dissent-core = { path = "crates/dissent-core" }
dissent-mls = { path = "crates/dissent-mls" }
dissent-media = { path = "crates/dissent-media" }
dissent-audio = { path = "crates/dissent-audio" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = { version = "3", features = ["rand_core", "serde"] }
rand = "0.10"
blake3 = "1"
bip39 = "3"
hex = "0.4"
data-encoding = "2"
iroh = "1"
rcgen = "0.14"
noq-proto = { version = "1.4", default-features = false, features = ["rustls", "aws-lc-rs"] }
iroh-gossip = "0.101"
iroh-blobs = "0.103"
iroh-mainline-address-lookup = "0.6"
pkarr = { version = "8", default-features = false, features = ["dht", "signed_packet"] }
url = { version = "2", features = ["serde"] }
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Match tauri-plugin-dialog, which uses rfd's gtk3 backend; rfd refuses gtk3 and xdg-portal together.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
mime_guess = "2"
futures-lite = "2"
negentropy = "0.5"
unicode-security = "0.1"
unicode-normalization = "0.1"
idna = "1"
hickory-resolver = { version = "0.25", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
iroh-relay = { version = "1.4.1", features = ["server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
axum = "0.8"
reqwest = { version = "0.13", features = ["json"] }
ring = "0.17"
windows-service = "0.8"
openmls = { version = "0.9", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
sframe = { version = "2", default-features = false, features = ["rust-crypto"] }
argon2 = "0.6"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
keyring = "4"
zeroize = "1"
cc = "1"
cpal = "0.18"
nnnoiseless = "0.5"
ringbuf = "0.5"
bytes = "1"
fs4 = "1"

[profile.dev]
# Line tables are enough for backtraces and stepping, and they link much faster than full debuginfo.
debug = "line-tables-only"

# Dependencies run optimized in dev builds, so the crypto, QUIC and MLS code is not the slow part of
# every test run. Workspace crates stay at opt-level 0 for quick compiles.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package.dissent-audio]
opt-level = 2
