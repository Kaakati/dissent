# Builds Dissent for Windows, macOS and Linux and publishes a GitHub release
# with notes generated from the commits since the previous release.
#
# Releases are automatic: every push to main that passes clippy and the test
# suite becomes the next patch version (v0.1.0, v0.1.1, ...). Docs-only pushes
# are skipped. A running build always finishes; a newer push waits behind it.
#
# Manual releases still work: push a tag (git tag v0.2.0 && git push origin v0.2.0)
# or run the workflow with a tag. The version in the built app always comes
# from the tag, set into Cargo.toml at build time.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/FUNDING.yml"
      - "LICENSE-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v0.2.0 (created at the current commit if missing)"
        required: true

permissions:
  contents: write

# One release build at a time on main. A running build always finishes; a newer push waits behind
# it (GitHub keeps only the newest waiting run, so pushes made while one builds release together).
concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Decide version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      auto: ${{ steps.v.outputs.auto }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"; auto=false
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"; auto=false
          else
            # Next patch after the highest vX.Y.Z tag; the first release is the Cargo version.
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            if [ -z "$last" ]; then
              tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            else
              IFS=. read -r major minor patch <<<"${last#v}"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
            # This commit is already released (e.g. a re-run): reuse its tag.
            existing=$(git tag --points-at "$sha" --list 'v*' | head -1)
            [ -n "$existing" ] && tag="$existing"
            auto=true
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "auto=$auto" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $sha (automatic: $auto)" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Set version
        run: sed -i '0,/^version = ".*"/s//version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (networked tests stay ignored)
        run: cargo test --workspace
      # Loopback-only suites that are #[ignore]d locally so Windows Firewall doesn't prompt
      # for every rebuilt test exe (they run through scripts/fwtest.sh there). CI has no prompt.
      - name: Loopback networked tests
        run: cargo test -p dissent-core --test calls --test part6 --test identity_flows --test typing -- --ignored

  changelog:
    name: Tag, changelog and draft release
    needs: [version, test]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      # Automatic releases don't create the tag here: publishing the release creates it at
      # $SHA. A run cancelled by a newer push then leaves only a draft, which the next run
      # reuses for the same version, so version numbers never skip.
      - name: Release notes for this version
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ needs.version.outputs.auto == 'true' && format('--unreleased --tag {0} --strip header', needs.version.outputs.tag) || '--latest --strip header' }}
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ needs.version.outputs.auto == 'true' && format('--tag {0}', needs.version.outputs.tag) || '' }}
        env:
          OUTPUT: CHANGELOG.md
      - name: Create or reuse the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=true --target "$SHA" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --draft --target "$SHA" --title "Dissent $TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" CHANGELOG.md --clobber
          id=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [version, changelog]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.name }}
      - name: Set version
        shell: bash
        run: |
          v='${{ needs.version.outputs.version }}'
          perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$v\"/m" Cargo.toml
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      # Bundling is off for local development; enable it only for releases. Signed
      # updater artifacts (and latest.json for in-app updates) are produced only
      # when the TAURI_SIGNING_PRIVATE_KEY secret is set.
      - name: Bundle config
        id: bundle
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo 'config={"bundle":{"active":true,"targets":"all","createUpdaterArtifacts":true}}' >> "$GITHUB_OUTPUT"
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without in-app update artifacts"
            echo 'config={"bundle":{"active":true,"targets":"all"}}' >> "$GITHUB_OUTPUT"
            echo "updater=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: cargo tauri
          releaseId: ${{ needs.changelog.outputs.release_id }}
          includeUpdaterJson: ${{ steps.bundle.outputs.updater }}
          args: ${{ matrix.args }} --config '${{ steps.bundle.outputs.config }}'
      # A single-file Windows build people can pass around and run without installing.
      - name: Upload portable exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="Dissent_${{ needs.version.outputs.version }}_x64_portable.exe"
          cp target/release/dissent-desktop.exe "$name"
          gh release upload "${{ needs.version.outputs.tag }}" "$name" --clobber

  tools:
    name: Tools (${{ matrix.name }})
    needs: [version, changelog]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            ext: ".exe"
          - name: macos-arm64
            os: macos-latest
            ext: ""
          - name: linux-x64
            os: ubuntu-22.04
            ext: ""
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tools-${{ matrix.name }}
      - name: Set version
        shell: bash
        run: |
          v='${{ needs.version.outputs.version }}'
          perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$v\"/m" Cargo.toml
      - name: Build seeder, relay, probe and push relay
        run: cargo build --release -p dissent-seeder -p dissent-relay -p dissent-probe -p dissent-push-relay
      - name: Package
        shell: bash
        run: |
          dir="dissent-tools-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          for bin in dissent-seeder dissent-relay dissent-probe dissent-push-relay; do
            cp "target/release/$bin${{ matrix.ext }}" "$dir/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          cp apps/seeder/README.md "$dir/SEEDER.md"
          cp apps/relay/README.md "$dir/RELAY.md"
          cp apps/probe/README.md "$dir/PROBE.md"
          cp apps/push-relay/README.md "$dir/PUSH-RELAY.md"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" >/dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  publish:
    name: Publish release
    needs: [version, desktop, tools]
    runs-on: ubuntu-latest
    steps:
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --repo "${{ github.repository }}" --draft=false --latest
