[package]
name = "dissent-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dissent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enabled by the Tauri CLI (tauri.conf.json build.features) so dev runs load embedded ui-next/dist assets.
custom-protocol = ["tauri/custom-protocol"]
# AV1 encoding through SVT-AV1 (builds from the third_party submodule). The release build turns it on.
svt-av1 = ["dissent-core/svt-av1"]
# Test picture for the camera and screen, from DISSENT_FAKE_CAPTURE=1, in release builds too. Never enabled in CI or the installers.
fake-capture = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(not(windows))'.dependencies]
rfd.workspace = true

[dependencies]
dissent-identity.workspace = true
dissent-core.workspace = true
dissent-discovery.workspace = true
dissent-events.workspace = true
dissent-audio = { workspace = true, features = ["sonora"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
url.workspace = true
blake3.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-notification.workspace = true
arboard.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-autostart.workspace = true
mime_guess.workspace = true
rand.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
