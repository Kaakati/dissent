[package]
name = "dissent-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dissent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enabled by the Tauri CLI (tauri.conf.json build.features) so dev runs load embedded ui/ assets.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(not(windows))'.dependencies]
rfd.workspace = true

[dependencies]
dissent-identity.workspace = true
dissent-core.workspace = true
dissent-audio.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
url.workspace = true
blake3.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true
mime_guess.workspace = true
rand.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
