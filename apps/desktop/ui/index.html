<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dissent</title>
  <link rel="icon" type="image/png" href="app-icon-96.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Custom 30 px title bar. The bar is the drag region; history and window controls are real buttons. -->
  <header id="titlebar" class="titlebar" data-tauri-drag-region>
    <nav class="titlebar-nav" aria-label="History" data-tauri-drag-region>
      <button class="icon-btn" id="tb-back" aria-label="Back" title="Back" disabled></button>
      <button class="icon-btn" id="tb-forward" aria-label="Forward" title="Forward" disabled></button>
    </nav>
    <div class="titlebar-title" id="tb-context" data-tauri-drag-region>
      <span class="titlebar-icon" id="tb-logo" data-tauri-drag-region></span>
      <span id="tb-title" data-tauri-drag-region></span>
    </div>
    <div class="titlebar-right" data-tauri-drag-region>
      <span id="mock-note" class="mock-note" hidden>Mock backend</span>
      <span id="net-status" class="net-status" hidden data-tauri-drag-region></span>
      <div class="window-controls" data-tauri-drag-region>
        <button class="icon-btn" id="tb-min" aria-label="Minimize" title="Minimize"></button>
        <button class="icon-btn" id="tb-max" aria-label="Maximize" title="Maximize"></button>
        <button class="icon-btn close" id="tb-close" aria-label="Close" title="Close"></button>
      </div>
    </div>
  </header>

  <div class="app" id="app" data-right="none">
    <nav id="rail" class="rail" aria-label="Servers"></nav>
    <aside id="sidebar" class="sidebar" aria-label="Channels and conversations"></aside>
    <main id="main" class="main"></main>
    <aside id="right" class="right" aria-label="Details" hidden></aside>
    <section id="me" class="me" aria-label="You"></section>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <span id="version" hidden></span>

  <script type="module" src="main.js"></script>
</body>
</html>
