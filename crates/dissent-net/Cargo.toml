[package]
name = "dissent-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Lets tests dial a media link on the token ALPN without sending a token.
test-hooks = []

[dependencies]
dissent-identity.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
postcard.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "process"] }
tracing.workspace = true
iroh = { workspace = true, features = ["tls-aws-lc-rs"] }
noq-proto.workspace = true
iroh-gossip.workspace = true
iroh-mainline-address-lookup.workspace = true
futures-lite.workspace = true
n0-future.workspace = true
ed25519-dalek.workspace = true
url = { workspace = true, features = ["serde"] }
data-encoding.workspace = true
blake3.workspace = true
rand.workspace = true
# Reads the port file the built-in Tor (arti) writes, a format of arti's.
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
dissent-net = { path = ".", features = ["test-hooks"] }
dissent-files.workspace = true
tracing-subscriber.workspace = true
iroh-relay = { workspace = true, features = ["test-utils"] }
rcgen.workspace = true

# Its main is also the fake arti the supervisor runs.
[[test]]
name = "tor_sidecar"
harness = false
