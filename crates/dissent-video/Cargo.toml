[package]
name = "dissent-video"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# AV1 encoding through SVT-AV1 builds from source and needs cmake, NASM and libclang. Off by default.
svt-av1 = ["dep:svt-av1-sys", "svt-av1-sys/build"]

[dependencies]
svt-av1-sys = { workspace = true, optional = true }
openh264.workspace = true
rav1d.workspace = true
re_mp4.workspace = true
matroska-demuxer.workspace = true
thiserror.workspace = true
tracing.workspace = true
image.workspace = true

# nokhwa's V4L2 backend (v4l2-sys-mit) and xcap's Linux backend (pipewire, xcb) run bindgen and
# pkg-config, so a Linux build needs libclang, PipeWire, xcb and Wayland development packages.
# See the Linux dependencies in .github/workflows/release.yml.
nokhwa.workspace = true
xcap.workspace = true

[dev-dependencies]
